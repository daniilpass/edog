# Конфигурация EDOG. Файл правится руками.
# Калибровка серво (zero / dir / пределы) пишется из веб-портала в calibration.json
# рядом с этим файлом и перекрывает значения отсюда.

[server]
host = "0.0.0.0"
port = 8080

[driver]
type = "pca9685"          # "mock" — без железа (разработка на ПК)
i2c_bus = 1
address = 0x40
frequency_hz = 50
oscillator_hz = 25000000  # у разных плат PCA9685 реально 25–27 МГц; ошибку хода закрывает scale калибровки

[geometry]
femur_mm = 50.0           # между осями крыльев на Femur (Femur_hub7: 50 мм)
tibia_mm = 41.7           # ось колена → середина подошвы (Tibia_v2_SG90_fit, см. cad/web)
tibia_bend_deg = 17.7     # изгиб голени: линия «ось колена → подошва» отклонена от корпуса голени
frame_margin_mm = 3.0     # запас: узел колена держится ниже плоскости рамы (leg_hull.json) на столько мм
body_length_mm = 200.0
body_width_mm = 95.0      # колея: расстояние между лапами левого и правого борта

[motion]
loop_hz = 100             # чаще ШИМ 50 Гц: каждый период серво получает свежий импульс, без пропусков
max_speed_dps = 300       # ограничение скорости поворота серво, °/с
stand_height_mm = 70.0    # высота оси бедра над полом в стойке
min_height_mm = 35.0
max_height_mm = 88.0
height_speed_mm_s = 30.0  # курки: скорость подъёма/опускания при нажатии до упора
max_tilt_deg = 15.0       # тангаж: предел и для команды, и для правого стика
max_roll_deg = 8.0        # крен: ноги без отведения, при крене лапы скользят вбок (~1.3 мм/°)
gait = "base"             # профиль ходьбы по умолчанию (см. [gaits]); выбор из портала — в calibration.json
drive_timeout_s = 0.5     # команда drive из веба гаснет без повторения

# Профили ходьбы (рысь): их же показывает демо. В портале видно размах суставов и упор в скорость серво.
# gait_hz — шагов (полных циклов) в секунду; stride_mm — длина шага при полном отклонении стика;
# lift_mm — высота подъёма лапы; foot_x_mm — лапа впереди (+) или позади (−) оси бедра: в стойке и при ходьбе вперёд;
# height_mm (необязательно) — высота оси бедра в стойке профиля и при ходьбе, без неё — stand_height_mm.
# У каждого профиля своя стойка: выбор профиля сразу ставит в неё. При ходьбе назад лапы за 0.5 с уходят под ось бедра.
[gaits.base]
title = "Базовая"
gait_hz = 1.6
stride_mm = 30.0
lift_mm = 15.0
# против заваливания на задние лапы; в стойке и вперёд — назад с ним шагает на месте.
# −10 мало: при отрыве задней лапы валится на неё; −20 много: клюёт носом.
foot_x_mm = -15.0

# Базовая на стопперах: всё как у base, корпус чуть выше. Стоппер выступает за подошву голени
# не больше чем на ~3 мм и только когда линия «колено → подошва» наклонена вперёд на 0–30°
# от вертикали; угол колена отдельно не задать (нога двухзвенная) — наклон голени даёт только
# высота и вынос лапы. На 78 мм наклон 6–35° — на стоппере ~78% опоры, край — сразу после
# постановки лапы (на 70 мм наклон 14–45°, на стоппере ~47%).
[gaits.base_stopper]
title = "Базовая на стопперах"
gait_hz = 1.6
stride_mm = 30.0
lift_mm = 15.0
height_mm = 78.0
foot_x_mm = -15.0

# Лимит тока серво: «подключёнными» можно отметить не больше limit_a / servo_a приводов.
# Из портала меняется и сохраняется в calibration.json (перекрывает значения отсюда).
[power]
limit_a = 8.0             # что отдаёт питание серво, А (BEC 6 В, 8 А, пик 16 А); 0 — без ограничения
servo_a = 0.9             # пиковый ток одного MG90S, А (в движении под нагрузкой 0.5–0.8, в упоре больше)

[servo_defaults]
installed = false         # сигнал только на подключённые серво; включается в портале по мере сборки
range_deg = 180.0
pulse_min_us = 500.0      # импульс для 0°
pulse_max_us = 2500.0     # импульс для range_deg
min_deg = 5.0             # программные пределы угла серво
max_deg = 175.0
# Угол серво = zero + dir·scale·угол сустава.
# zero — угол серво при нулевом угле сустава. По умолчанию = 90 − dir·ref_deg,
# то есть в центре серво (90°) сустав стоит в монтажном положении. Уточняется калибровкой.
# scale — градусов серво на градус сустава (по умолчанию 1): ход реального серво на 500–2500 мкс
# не ровно 180° и у каждого свой, плюс неточный oscillator_hz. Пишется второй точкой калибровки.

# Монтажное положение сустава (ref_deg): в нём надевается крыло при серво в 90°
# и по нему калибруется zero (оно легко выставляется на глаз/угольником).
# Калибровочная поза под нагрузкой (load_deg): собака стоит на лапах почти как в стойке base
# (лапа на 16 мм позади оси бедра, высота 72 мм). Бедро — вторая точка, по ней пишется scale
# (монтажное положение при этом не сдвигается); колено — тот же угол, что в монтаже, но с весом
# на ноге: люфт шестерён выбран в рабочую сторону, по нему переписывается zero.
[joints.hip]
ref_deg = 0.0             # бедро вертикально вниз
load_deg = -45.0          # бедро нижним концом назад на 45° (угольник 45° к раме)
[joints.knee]
ref_deg = 90.0            # корпус голени под прямым углом к бедру
load_deg = 90.0

# Ноги. x_mm — смещение оси бедра от центра корпуса (+ вперёд; оси бёдер в 112.4 мм друг от друга).
# knee_dir: -1 — колено смотрит назад, +1 — вперёд.
# Углы суставов: hip 0° — бедро вертикально вниз, + — лапа вперёд;
#                knee — угол между бедром и корпусом голени: 0° — на одной линии, + — голень вперёд.
# dir: знак связи «угол сустава → угол серво». Зеркальные стороны обычно с противоположным знаком.
[legs.FL]
side = "left"
x_mm = 56.2
knee_dir = -1
hip = { channel = 8, dir = -1 }
knee = { channel = 9, dir = 1 }

[legs.FR]
side = "right"
x_mm = 56.2
knee_dir = -1
hip = { channel = 4, dir = 1 }
knee = { channel = 5, dir = -1 }

[legs.RL]
side = "left"
x_mm = -56.2
knee_dir = -1
hip = { channel = 10, dir = -1 }
knee = { channel = 11, dir = 1 }

[legs.RR]
side = "right"
x_mm = -56.2
knee_dir = -1
hip = { channel = 6, dir = 1 }
knee = { channel = 7, dir = -1 }

# Геймпад (evdev, стандартная раскладка Linux).
# Имена кодов: evtest /dev/input/eventN
[gamepad]
deadzone = 0.25          # доля хода стика от центра, которая не считается

[gamepad.axes]
drive = "ABS_Y"           # левый стик: вперёд/назад
turn = "ABS_X"            # левый стик: поворот
pitch = "ABS_RZ"          # правый стик ↕: тангаж (Xbox по BT; у DualShock и др. — ABS_RY)
roll = "ABS_Z"            # правый стик ↔: крен (Xbox по BT; у DualShock и др. — ABS_RX)
height_down = "ABS_BRAKE" # левый курок: опускать, пока нажат (скорость — от силы нажатия)
height_up = "ABS_GAS"     # правый курок: поднимать

[gamepad.buttons]
# Имена по подписям Xbox: у него по BT X = код 307 (BTN_X = BTN_NORTH), Y = 308 (BTN_Y = BTN_WEST).
# У DualShock/DualSense □ = BTN_WEST = BTN_Y и △ = BTN_NORTH = BTN_X — для них X и Y поменять местами.
BTN_A = "stand"             # A
BTN_B = "sit"               # B
BTN_X = "lie"               # X
BTN_Y = "high"              # Y
BTN_START = "torque_toggle" # Start / Options
BTN_SELECT = "next_gait"    # Back / Share: следующий профиль ходьбы
BTN_TL = "roll_left"        # LB / L1: крен −1° (левый борт ниже), держится до выключения серво
BTN_TR = "roll_right"       # RB / R1: крен +1° (правый борт ниже)

[gamepad.dpad]
up = "jump"                 # крестовина вверх: прыжок
down = "joy"                # крестовина вниз: радость
